# Worked example — Workflow Proof, route `illustrative`.
#
# It lives here rather than under demo/ so it ships with the plugin; copy it
# into your own demo/<name>/ directory and adapt. Every field below already
# exists in the schema — a testimonial needs no code that a product demo
# does not.

prompt: >-
  Testimonio en formato workflow-proof para AiCrawl. Persona ficticia,
  ruta ilustrativa, revelada en la tarjeta inicial y en la final. Abre con
  el resultado, muestra el problema en pantalla, y cierra en la salida
  limpia que devuelve la API.

# The metric leads; `title` is the attribution drawn under it, and the
# disclosure rides in `subtitle` so a clip trimmed for a feed still carries it.
titleCard:
  stat:
    value: "6 h"
    label: "por semana, recuperadas"
  title: "Lucía R. — Datos, Nordika"
  subtitle: "Testimonio ilustrativo. Persona y datos ficticios."
  duration: 1600

app:
  url: http://localhost:8080/
  viewport:
    width: 1920
    height: 1080
  scale: 2
  # 1.35, not the 1.25 a product demo uses: in a testimonial the detail is
  # the proof, so the screen has to be readable at feed size.
  zoom: 1.35
  colorScheme: dark

tts:
  voice: eve        # never `sal` — that is the product's voice
  speed: 0.96       # just under 1.0 reads as a person

subtitles:
  burn: true

recording:
  outputDir: "."
  fps: 30

segments:
  # What it used to be. Past tense, specific, no product name yet.
  - id: antes
    narration: >-
      Antes escribía un scraper para cada sitio. Se rompían cada dos
      semanas y me pasaba los lunes arreglándolos.
    intent: "mostrar la sección que describe el problema del HTML sucio"
    timing: parallel
    actions:
      - type: scroll
        target: { selector: "#value" }
        done:
          visible: "#value"
      - type: wait
        duration: 3000

  # The moment. One action, visible consequence.
  - id: el-momento
    narration: >-
      Ahora hago una llamada y me devuelve el contenido ya limpio.
    intent: "ir al ejemplo de código desde el menú"
    timing: parallel
    actions:
      - type: click
        target: { selector: 'nav a[href="#code"]:not(.block)' }
        done:
          visible: "#code"
      - type: wait
        duration: 3000

  # The proof. The result on screen, with the contrast in the voice.
  - id: la-prueba
    narration: >-
      Esto es lo que recibe mi modelo. Markdown limpio, sin scripts ni
      anuncios. Dejé de pagar tokens por basura.
    intent: "aterrizar en el bloque de respuesta de la API"
    timing: parallel
    actions:
      - type: scroll
        target: { role: heading, name: "Respuesta:" }
      - type: wait
        duration: 3500

# Commits to the result, not a generic call to action. Carries the
# disclosure a second time.
endCard:
  title: "Seis horas por semana, de vuelta"
  subtitle: "Testimonio ilustrativo. Persona y datos ficticios."
  duration: 2600
